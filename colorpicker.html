<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图片取色器 · 任意一点取色</title>
<style>
  :root{
    --bg:#14161a; --panel:#1c1f26; --line:#2c3038; --txt:#e6e8ec; --dim:#8b93a1; --acc:#4c9aff;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--txt); min-height:100vh;
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:24px 20px 40px;
  }
  h1{font-size:18px; margin:0 0 4px; font-weight:600}
  .sub{color:var(--dim); font-size:13px; margin:0 0 20px}
  .wrap{display:flex; gap:20px; align-items:flex-start; flex-wrap:wrap; justify-content:center}

  .stage{
    position:relative; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:12px; line-height:0;
  }
  #cv{
    display:block; max-width:min(560px, 78vw); height:auto; border-radius:8px;
    cursor:crosshair; image-rendering:auto;
  }
  #cursor{
    position:absolute; width:14px; height:14px; margin:-7px 0 0 -7px; border-radius:50%;
    border:2px solid #fff; box-shadow:0 0 0 1px rgba(0,0,0,.8), inset 0 0 0 1px rgba(0,0,0,.5);
    pointer-events:none; display:none; z-index:3;
  }
  #lens{
    position:absolute; display:none; z-index:4; pointer-events:none;
    border:1px solid rgba(255,255,255,.35); border-radius:6px; overflow:hidden;
    box-shadow:0 6px 20px rgba(0,0,0,.6); background:#000;
  }
  #lensCv{display:block}
  #cross{
    position:absolute; border:1px solid #fff; box-shadow:0 0 0 1px #000; pointer-events:none;
  }

  .panel{
    width:280px; background:var(--panel); border:1px solid var(--line);
    border-radius:14px; padding:16px;
  }
  .panel.side{width:280px}
  #swatch{
    height:96px; border-radius:10px; border:1px solid var(--line);
    background:#22252c; position:relative; overflow:hidden;
  }
  #swatchTxt{
    position:absolute; left:0; right:0; bottom:0; padding:6px 10px;
    font:12px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;
    background:rgba(0,0,0,.35); color:#fff; text-align:center; letter-spacing:.5px;
  }
  .row{
    display:flex; align-items:center; gap:8px; margin-top:10px;
  }
  .row .k{width:38px; color:var(--dim); font-size:12px; flex:none}
  .row code{
    flex:1; font:13px/1 ui-monospace,SFMono-Regular,Consolas,monospace;
    background:#14161a; border:1px solid var(--line); border-radius:6px; padding:7px 9px;
    user-select:all; overflow:hidden; text-overflow:ellipsis;
  }
  button{
    background:#262a33; color:var(--txt); border:1px solid var(--line);
    border-radius:6px; padding:6px 10px; font-size:12px; cursor:pointer; flex:none;
    transition:.15s;
  }
  button:hover{background:#30353f; border-color:#3d434e}
  button.ok{background:#2f7d4f; border-color:#2f7d4f; color:#fff}
  .meta{color:var(--dim); font-size:12px; margin-top:10px; display:flex; justify-content:space-between}

  hr{border:0; border-top:1px solid var(--line); margin:16px 0}
  .ttl{font-size:12px; color:var(--dim); margin-bottom:8px; letter-spacing:.5px}
  #hist{display:flex; flex-wrap:wrap; gap:6px; min-height:26px}
  .chip{
    width:26px; height:26px; border-radius:5px; border:1px solid rgba(255,255,255,.16);
    cursor:pointer; position:relative;
  }
  .chip:hover{transform:scale(1.12)}
  .empty{color:#5c6472; font-size:12px}

  .tools{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:16px}
  .btn{display:inline-block}
  #file{display:none}
  .hint{color:var(--dim); font-size:12px}
  #tip{color:#e0a458; font-size:12px; margin-bottom:10px; display:none; max-width:560px}
  #drop{
    border:1px dashed var(--line); border-radius:8px; padding:2px 8px; color:var(--dim); font-size:12px;
  }
  #drop.on{border-color:var(--acc); color:var(--acc)}
  kbd{
    background:#262a33; border:1px solid var(--line); border-bottom-width:2px;
    border-radius:4px; padding:1px 5px; font-size:11px; font-family:inherit;
  }
</style>
</head>
<body>

<h1>图片取色器</h1>
<p class="sub">鼠标移动即可实时读取任意一点的颜色，<kbd>点击</kbd>把颜色存入下方色卡，点色卡复制 HEX</p>

<div class="tools">
  <label class="btn"><button type="button" onclick="document.getElementById('file').click()">换一张图片</button></label>
  <input type="file" id="file" accept="image/*">
  <span id="drop">或把图片拖进页面</span>
  <span class="hint" id="dim"></span>
</div>

<div id="tip"></div>

<div class="wrap">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="cursor"></div>
    <div id="lens"><canvas id="lensCv"></canvas><div id="cross"></div></div>
  </div>

  <div class="panel side">
    <div id="swatch"><div id="swatchTxt">移动鼠标开始</div></div>

    <div class="row"><span class="k">HEX</span><code id="hex">—</code><button id="c1">复制</button></div>
    <div class="row"><span class="k">RGB</span><code id="rgb">—</code><button id="c2">复制</button></div>
    <div class="row"><span class="k">HSL</span><code id="hsl">—</code><button id="c3">复制</button></div>

    <div class="meta">
      <span id="pos">坐标 —</span>
      <span id="alpha">Alpha —</span>
    </div>

    <hr>
    <div class="ttl">已取颜色</div>
    <div id="hist"><span class="empty">还没有，点击画布试试</span></div>
  </div>
</div>

  var ctx    = cv.getContext('2d', { willReadFrequently: true });
  var lensCv = document.getElementById('lensCv');
  var lctx   = lensCv.getContext('2d');
  var lens   = document.getElementById('lens');
  var cross  = document.getElementById('cross');
  var cursor = document.getElementById('cursor');
  var stage  = document.getElementById('stage');
  var swatch = document.getElementById('swatch');
  var swTxt  = document.getElementById('swatchTxt');
  var tipEl  = document.getElementById('tip');
  var histEl = document.getElementById('hist');

  var LENS = 10;   // 放大镜采样边长（原图像素）
  var ZOOM = 6;   // 放大倍数
  lensCv.width = lensCv.height = LENS * ZOOM;
  lens.style.width = lens.style.height = (LENS * ZOOM) + 'px';
  cross.style.width = cross.style.height = ZOOM + 'px';
  cross.style.left = cross.style.top = ((LENS * ZOOM - ZOOM) / 2) + 'px';
  lctx.imageSmoothingEnabled = false;

  var hist = [];
  var ready = false;

  /* ---------- 图片载入 ---------- */
  function load(src, fallbackMsg){
    var img = new Image();
    img.onload = function(){
      cv.width  = img.naturalWidth;
      cv.height = img.naturalHeight;
      ctx.clearRect(0, 0, cv.width, cv.height);
      ctx.drawImage(img, 0, 0);
      ready = true;
      document.getElementById('dim').textContent = cv.width + ' × ' + cv.height + ' px';
      tip('');
    };
    img.onerror = function(){ tip(fallbackMsg || '图片加载失败，请点「换一张图片」从本地选择'); };
    img.src = src;
  }
  load(DEFAULT_IMAGE, '默认示例图加载失败，请点上方按钮选择本地图片');

  /* ---------- 坐标换算 + 取色 ---------- */
  function pickAt(clientX, clientY){
    if (!ready) return null;
    var r  = cv.getBoundingClientRect();
    // 关键：用比例换算到画布真实像素，天然兼容 CSS 缩放 / 高清屏
    var fx = (clientX - r.left) / r.width;
    var fy = (clientY - r.top)  / r.height;
    var x  = Math.floor(fx * cv.width);
    var y  = Math.floor(fy * cv.height);
    if (x < 0 || y < 0 || x >= cv.width || y >= cv.height) return null;
    var d;
    try {
      d = ctx.getImageData(x, y, 1, 1).data;
    } catch (e) {
      tip('读取像素失败：画布被跨域图片污染了，请用「换一张图片」从本地载入');
      return null;
    }
    return { x:x, y:y, r:d[0], g:d[1], b:d[2], a:d[3] };
  }

  function hex(r,g,b){
    return '#' + [r,g,b].map(function(v){ return v.toString(16).padStart(2,'0'); }).join('').toUpperCase();
  }
  function rgbToHsl(r,g,b){
    r/=255; g/=255; b/=255;
    var mx=Math.max(r,g,b), mn=Math.min(r,g,b), h=0, s=0, l=(mx+mn)/2;
    if (mx !== mn){
      var d = mx - mn;
      s = l > 0.5 ? d/(2-mx-mn) : d/(mx+mn);
      if (mx === r)      h = (g-b)/d + (g < b ? 6 : 0);
      else if (mx === g) h = (b-r)/d + 2;
      else               h = (r-g)/d + 4;
      h /= 6;
    }
    return [Math.round(h*360), Math.round(s*100), Math.round(l*100)];
  }

  function render(p){
    if (!p) return;
    var h = rgbToHsl(p.r, p.g, p.b);
    swatch.style.background = 'rgb(' + p.r + ',' + p.g + ',' + p.b + ')';
    swTxt.textContent = hex(p.r,p.g,p.b);
    swTxt.style.color = (p.r*299 + p.g*587 + p.b*114) / 1000 > 140 ? '#000' : '#fff';
    document.getElementById('hex').textContent = hex(p.r,p.g,p.b);
    document.getElementById('rgb').textContent = 'rgb(' + p.r + ', ' + p.g + ', ' + p.b + ')';
    document.getElementById('hsl').textContent = 'hsl(' + h[0] + ', ' + h[1] + '%, ' + h[2] + '%)';
    document.getElementById('pos').textContent = '坐标 ' + p.x + ', ' + p.y;
    document.getElementById('alpha').textContent = 'Alpha ' + (p.a/255).toFixed(2);
  }

  /* ---------- 鼠标交互 ---------- */
  cv.addEventListener('mousemove', function(e){
    var p = pickAt(e.clientX, e.clientY);
    if (!p){ cursor.style.display = lens.style.display = 'none'; return; }

    var r = cv.getBoundingClientRect();
    var sr = stage.getBoundingClientRect();
    var lx = (e.clientX - r.left) * (r.width / cv.width);   // 显示坐标
    var ly = (e.clientY - r.top)  * (r.height / cv.height);

    cursor.style.display = 'block';
    cursor.style.left = (lx + cv.offsetLeft) + 'px';
    cursor.style.top  = (ly + cv.offsetTop)  + 'px';

    lctx.clearRect(0, 0, lensCv.width, lensCv.height);
    lctx.drawImage(cv,
      p.x - (LENS>>1), p.y - (LENS>>1), LENS, LENS,
      0, 0, LENS*ZOOM, LENS*ZOOM);

    lens.style.display = 'block';
    var off = 18;
    var lw = LENS*ZOOM, flipX = (lx + cv.offsetLeft + off + lw + 12 > sr.width);
    lens.style.left = (lx + cv.offsetLeft + (flipX ? -off - lw : off)) + 'px';
    lens.style.top  = Math.max(0, ly + cv.offsetTop - lw - off) + 'px';

    render(p);
  });

  cv.addEventListener('mouseleave', function(){
    cursor.style.display = 'none';
    lens.style.display = 'none';
  });

  cv.addEventListener('click', function(e){
    var p = pickAt(e.clientX, e.clientY);
    if (!p) return;
    if (hist.length >= 24) hist.shift();
    hist.push({ hex: hex(p.r,p.g,p.b), rgb: 'rgb(' + p.r + ', ' + p.g + ', ' + p.b + ')' });
    drawHist();
  });

  function drawHist(){
    if (!hist.length){ histEl.innerHTML = '<span class="empty">还没有，点击画布试试</span>'; return; }
    histEl.innerHTML = '';
    hist.forEach(function(c){
      var d = document.createElement('div');
      d.className = 'chip';
      d.style.background = c.rgb;
      d.title = c.hex + '  点击复制';
      d.onclick = function(){ copy(c.hex, d); };
      histEl.appendChild(d);
    });
  }

  /* ---------- 复制 ---------- */
  function copy(text, btn){
    var done = function(){ flash(btn); };
    if (navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(text).then(done, fallback);
    } else fallback();
    function fallback(){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch(e){}
      ta.remove(); done();
    }
  }
  function flash(btn){
    if (!btn || !btn.tagName) return;
    var old = btn.textContent;
    btn.textContent = '已复制'; btn.classList.add('ok');
    setTimeout(function(){ btn.textContent = old; btn.classList.remove('ok'); }, 900);
  }

  var lastP = null;
  ['hex','rgb','hsl'].forEach(function(k, i){
    document.getElementById('c' + (i+1)).onclick = function(){
      var t = document.getElementById(k).textContent;
      if (t && t !== '—') copy(t, this);
    };
  });

  /* ---------- 换图：本地文件（FileReader → dataURL，同源不污染画布） ---------- */
  document.getElementById('file').addEventListener('change', function(e){
    var f = e.target.files && e.target.files[0];
    if (f) readFile(f);
  });

  function readFile(f){
    if (!/^image\//.test(f.type)){ tip('请选择图片文件'); return; }
    var fr = new FileReader();
    fr.onload = function(){
      hist = []; drawHist();
      load(fr.result, '图片解析失败');
    };
    fr.readAsDataURL(f);
  }

  var drop = document.getElementById('drop');
  ['dragenter','dragover'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.add('on'); });
  });
  ['dragleave','drop'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); drop.classList.remove('on'); });
  });
  document.addEventListener('drop', function(e){
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if (f) readFile(f);
  });

  function tip(msg){
    tipEl.textContent = msg || '';
    tipEl.style.display = msg ? 'block' : 'none';
  }
})();
</script>
