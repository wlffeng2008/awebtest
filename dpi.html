<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      .wrap {
        background: #1e1e1e;
        padding: 20px;
        color: #fff;
        font-family: system-ui;
      }

      /* 右上角开关行 */
      .row-top {
        display: flex;
        justify-content: flex-end;
        align-items: center;
        gap: 12px;
        margin-bottom: 10px;
      }
      .row-top .text {
        font-size: 20px;
        color: #fff;
      }

      /* 自定义toggle开关（你前面的开关样式） */
      .toggleDPI {
        position: relative;
        width: 64px;
        height: 28px;
      }
      .toggleDPI input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0px;
        left: 0;
        right: 0;
        bottom: 0;
        background: #666;
        border-radius: 32px;
        transition: 0.2s;
      }
      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 24px;
        width: 24px;
        top: 2px;
        left: 1px;
        bottom: 1px;
        background: white;
        border-radius: 50%;
        transition: 0.2s;
      }
      .toggleDPI input:checked + .toggle-slider {
        background: #13ce66;
      }
      .toggleDPI input:checked + .toggle-slider:before {
        transform: translateX(36px);
      }

      /* DPI快捷按钮容器 */
      .dpiPresetWrap {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }
      /* DPI预设项：圆形色块 + 文字 */
      .dpiItem {
        display: flex;
        align-items: center;
        gap: 5px;
        cursor: pointer;
      }
      .dpiColorCircle {
        width: 24px;
        height: 24px;
        border-radius: 8px;
        border: 2px solid transparent;
      }
      /* 选中态：蓝色外框 */
      .dpiItem.active .dpiColorCircle {
        border-color: #0088ff;
      }
      .dpiValueText {
        font-size: 16px;
        color: #fff;
      }

      /* 滑块区域 */
      .sliderRow {
        width: 100%;
      }

      .dpiSlider {
        width: 100%;
        height: 12px;
        margin: 20px 0;
        cursor: pointer;
        -webkit-appearance: none; /* 必须，清除原生样式才能自定义 */
        background: transparent;
      }
      /* 轨道样式 */
      .dpiSlider::-webkit-slider-runnable-track {
        height: 12px;
        background: #333862; /* 轨道底色 */
        border-radius: 6px;
      }
      /* 滑块小圆点 */
      .dpiSlider::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        margin-top: -4px; /* 垂直居中对齐轨道 */
        background: #13ce66;
        border-radius: 50%;
        border: none;
      }
      /* 滑块hover效果 */
      .dpiSlider::-webkit-slider-thumb:hover {
        background: #36d37f;
      }

      /* 底部文字：左右两端文字 */
      .sliderLabelRow {
        display: flex;
        justify-content: space-between;
        font-size: 16px;
        color: #fff;
      }
      /* 右侧DPI数值输入框 */
      .dpiInputBox {
        display: flex;
        gap: 10px;
        align-items: center;
        justify-content: flex-end;
        position: relative;
        top: -30px;
      }
      .dpiInputBox input {
        width: 90px;
        border-radius: 6px;
        font-size: 16px;
        background: #1e1e1e;
        color: #0ff;
        border: 2px solid #fff;
        text-align: center;
        padding: 4px;
      }
      .dpiInputBox span {
        font-size: 16px;
      }

    left:50%;

}

}

/* 右侧HSV取色板 */
.colorPicker{
    width:420px;
    height:320px;
    background:linear-gradient(90deg, red, yellow, lime, cyan, blue, magenta, red);
    position:relative;
    border-radius:8px;
    overflow:hidden;
}
.colorPicker::after{
    content:"";
    position:absolute;
    inset:0;
     background:linear-gradient(0deg, #000 0%, transparent 50%, #fff 100%); 
}

.colorPicker{
    width:420px;
    height:320px;
    position:relative;
    border-radius:8px;
    overflow:hidden;
    cursor:crosshair;
}
/* 底层：色相 */
.colorPicker .hsvHue{
    width:100%;
    height:100%;
    background:linear-gradient(90deg, red, yellow, lime, cyan, blue, magenta, red);
}
/* 上层：饱和度遮罩：从上到下：透明 → 白色 */
.colorPicker .hsvSat{
    width:100%;
    height:100%;
    position:absolute;
    top:0;
    left:0;
    /* 顶部：完全透明（饱和最高）；底部纯白（饱和度0） */
    background:linear-gradient(100deg, transparent 0%, 0 100%);
}

/* 拾取标记圆点 */
.colorPicker .pickerDot{
    width:12px;
    height:12px;
    border-radius:50%;
    border:1px solid #fff;
    position:absolute;
    pointer-events:none;
    transform:translate(-50%,-50%);
}
/* 底部明度条（Value） */
.valueBar{
    width:420px;
    height:24px;
    margin-top:8px;
    background:linear-gradient(90deg, #000, #fff);
    border-radius:4px;
    cursor:crosshair;
    position:relative;
}
.valueBar .vDot{
    width:12px;
    height:12px;
    border-radius:50%;
    border:1px solid #fff;
    position:absolute;
    top:50%;
    pointer-events:none;
    transform:translate(-50%,-50%);
}

      toggleDpi.addEventListener("change", function () {
        const state = toggleDpi.checked;
        doubleFlag = state;
        console.log("DPI开关切换：", state);
        let frameY = document.getElementById("frameDpiY");
        if (state) frameY.style.cssText = `display: block;margin-top: 50px;`;
        else frameY.style.cssText = `display: none`;
      });

      // 渲染DPI彩色圆点
      function renderPresetDpi() {
        wrapX.innerHTML = "";
        dpiPresetList.forEach((item, index) => {
          const div = document.createElement("div");
          div.className = "dpiItem";
          div.id = `dpiItem${index}`;
          div.style.cssText = `width:100px; border:2px solid transparent; border-radius:6px;padding:4px;`;
          if (currentIndex === index) {
            div.style.cssText = `width:100px; border: 2px solid ${item.color}; border-radius:6px;padding:4px;`;
          }
          div.innerHTML = `
                <div class="dpiColorCircle"  style="background:${item.color};"></div>
                <span class="dpiValueText">${item.valX}</span>
            `;
          div.onclick = () => {
            let v = item.valX;
            sliderX.value = v;
            numInputX.value = v;
            currentIndex = index;
            if (!doubleFlag) {
              sliderY.value = v;
              numInputY.value = v;
            }

            renderPresetDpi();
          };
          wrapX.appendChild(div);
        });

        wrapY.innerHTML = "";
        dpiPresetList.forEach((item, index) => {
          const div = document.createElement("div");
          div.className = "dpiItem";
          div.id = `dpiItem${index}`;
          div.style.cssText = `width:100px; border:2px solid transparent; border-radius:6px;padding:4px;`;

            div.style.cssText = `width:100px; border: 2px solid ${item.color}; border-radius:6px;padding:4px;`;
          }
          div.innerHTML = `
            <div class="dpiColorCircle"  style="background:${item.color};"></div>
            <span class="dpiValueText">${item.valY}</span>
        `;
          div.onclick = () => {
            let v = item.val;
            sliderY.value = v;
            numInputY.value = v;
            currentIndex = index;
            renderPresetDpi();
          };
          wrapY.appendChild(div);
        });

        sliderX.disabled = false;
        sliderX.style.pointerEvents = "auto";
        sliderY.disabled = false;
        sliderY.style.pointerEvents = "auto";
      }

      sliderX.addEventListener("input", () => {
        let v = Math.floor(Number(sliderX.value) / 50) * 50;
        v = Math.max(50, Math.min(42000, v));
        numInputX.value = v;
        dpiPresetList[currentIndex]["valX"] = v;
        if (!doubleFlag) {
          sliderY.value = v;
            numInputY.value = v;
          dpiPresetList[currentIndex]["valY"] = v;
        }
        renderPresetDpi();
      });

        sliderX.value = v;

        if (!doubleFlag) {
          sliderY.value = v;
            numInputY.value = v;
          dpiPresetList[currentIndex]["valY"] = v;
        }
        renderPresetDpi();
      });

      sliderY.addEventListener("input", () => {
        let v = Math.floor(Number(sliderY.value) / 50) * 50;
        v = Math.max(50, Math.min(42000, v));
        numInputY.value = v;
        dpiPresetList[currentIndex]["valY"] = v;
        renderPresetDpi();
      });

      numInputY.addEventListener("change", () => {
        let v = Math.floor(Number(numInputY.value) / 50) * 50;
        v = Math.max(50, Math.min(42000, v));
        sliderY.value = v;
        dpiPresetList[currentIndex]["valY"] = v;
        renderPresetDpi();
      });

      // 初始化
      renderPresetDpi();

let hsv = {h:0, s:1, v:1};
const colorPicker = document.querySelector('.colorPicker');
const pickerDot = document.querySelector('.pickerDot');
const valueBar = document.querySelector('.valueBar');
const vDot = document.querySelector('.vDot');

function hsvToRgb(h, s, v) {
    let r = 0, g = 0, b = 0;
    if (s === 0) {
        r = g = b = v;
    } else {
        const i = Math.floor(h * 6);
        const f = h * 6 - i;
        const p = v * (1 - s);
        const q = v * (1 - f * s);
        const t = v * (1 - (1 - f) * s);
        switch (i % 6) {
            case 0: r = v; g = t; b = p; break;
            case 1: r = q; g = v; b = p; break;
            case 2: r = p; g = v; b = t; break;
            case 3: r = p; g = q; b = v; break;
            case 4: r = t; g = p; b = v; break;
            case 5: r = v; g = p; b = q; break;
        }
    }
    return {
        r: Math.round(r * 255),
        g: Math.round(g * 255),
        b: Math.round(b * 255)
    };
}

function rgbToHsv(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    const max = Math.max(r, g, b), min = Math.min(r, g, b);
    let h, s, v = max;
    const d = max - min;
    s = max === 0 ? 0 : d / max;
    if (max === min) {
        h = 0;
    } else {
        switch (max) {
            case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
            case g: h = ((b - r) / d + 2) / 6; break;
            case b: h = ((r - g) / d + 4) / 6; break;
        }
    }
    return {h, s, v};
}

function handleColorPick(e) {
    const x = e.offsetX;
    const y = e.offsetY;
    const xClamp = Math.max(0, Math.min(colorPicker.clientWidth, x));
    const yClamp = Math.max(0, Math.min(colorPicker.clientHeight, y));

    hsv.h = xClamp / colorPicker.clientWidth;
    hsv.s = 1 - (yClamp / colorPicker.clientHeight);

    updatePickerDot(xClamp, yClamp);
    outputColor();
}

colorPicker.addEventListener('mousedown', handleColorPick);
colorPicker.addEventListener('mousemove', (e) => {
    if (e.buttons !== 1) return;
    handleColorPick(e);
});

function handleValuePick(e) {
    const x = e.offsetX;
    const xClamp = Math.max(0, Math.min(valueBar.clientWidth, x));
    hsv.v = xClamp / valueBar.clientWidth;
    updateVDot(xClamp);
    outputColor();
}
valueBar.addEventListener('mousedown', handleValuePick);
valueBar.addEventListener('mousemove', (e) => {
    if (e.buttons !== 1) return;
    handleValuePick(e);
});

function updatePickerDot(x, y) {
    pickerDot.style.left = `${x}px`;
    pickerDot.style.top = `${y}px`;
}
function updateVDot(x) {
    vDot.style.left = `${x}px`;
}

function outputColor() {
    const rgb = hsvToRgb(hsv.h, hsv.s, hsv.v);
    const hex = `#${rgb.r.toString(16).padStart(2, '0')}${rgb.g.toString(16).padStart(2, '0')}${rgb.b.toString(16).padStart(2, '0')}`;
    console.log("HSV: ", {h:hsv.h.toFixed(3), s:hsv.s.toFixed(3), v:hsv.v.toFixed(3)});
    console.log("RGB: ", rgb, "HEX:", hex);
    // window.qtBridge.onColorPick(rgb.r, rgb.g, rgb.b);
}

function setColorFromRGB(r,g,b) {
    const newHsv = rgbToHsv(r,g,b);
    hsv.h = newHsv.h;
    hsv.s = newHsv.s;
    hsv.v = newHsv.v;
    const pickX = hsv.h * colorPicker.clientWidth;
    const pickY = (1 - hsv.s) * colorPicker.clientHeight;
    updatePickerDot(pickX, pickY);
    const vX = hsv.v * valueBar.clientWidth;
    updateVDot(vX);
    outputColor();
}

updateVDot(valueBar.clientWidth);
setColorFromRGB(255,0,0);



    </script>
