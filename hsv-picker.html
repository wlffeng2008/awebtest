<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HSV / HSL 取色板 · 解析法取色</title>
<style>
  :root{--bg:#14161a;--panel:#1c1f26;--line:#2c3038;--txt:#e6e8ec;--dim:#8b93a1;--ok:#2f7d4f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);min-height:100vh;padding:24px 20px 48px;
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center}
  h1{font-size:18px;margin:0 0 4px;font-weight:600}
  .sub{color:var(--dim);font-size:13px;margin:0 0 22px;text-align:center;max-width:760px}
  .grid{display:flex;gap:22px;flex-wrap:wrap;justify-content:center;align-items:flex-start}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .card h2{font-size:13px;margin:0 0 10px;color:var(--dim);font-weight:600;letter-spacing:.4px}
  .card .note{font-size:11px;color:#6b7383;margin-top:9px;line-height:1.5}

  /* ===== 修正后的色板：HSV 版（横向 H，纵向 V，S 恒为 1） ===== */
  .colorPicker{
    width:420px;height:320px;position:relative;border-radius:8px;overflow:hidden;cursor:crosshair;
    /* 底层：色相 H，横向 0° → 360° */
    background:linear-gradient(90deg,
      red 0%, yellow 16.667%, lime 33.333%, cyan 50%,
      blue 66.667%, magenta 83.333%, red 100%);
  }
  /* 上层：明度 V，顶部纯色 → 底部纯黑（180deg = to bottom） */
  .colorPicker::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(180deg, rgba(0,0,0,0) 0%, #000 100%);
  }
  /* HSL 变体：明度换成 L 轴（白 → 纯色 → 黑） */
  .colorPicker.hsl::after{
    background:linear-gradient(180deg,
      #fff 0%, rgba(255,255,255,0) 50%, rgba(0,0,0,0) 50%, #000 100%);
  }
  /* 取色光标：必须是真实子元素 + z-index，否则会被 ::after 盖住 */
  .thumb{
    position:absolute;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;
    border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.85), inset 0 0 0 1px rgba(0,0,0,.55);
    pointer-events:none;z-index:2;display:none;
  }

  .readout{width:300px}
  #sw{height:92px;border-radius:10px;border:1px solid var(--line);background:#22252c;
    position:relative;overflow:hidden}
  #swTxt{position:absolute;left:0;right:0;bottom:0;padding:6px 10px;text-align:center;
    font:12px/1.4 ui-monospace,Consolas,monospace;background:rgba(0,0,0,.32);color:#fff;letter-spacing:.5px}
  .row{display:flex;align-items:center;gap:8px;margin-top:9px}
  .row .k{width:36px;color:var(--dim);font-size:12px;flex:none}
  .row code{flex:1;font:13px/1 ui-monospace,Consolas,monospace;background:#14161a;
    border:1px solid var(--line);border-radius:6px;padding:7px 9px;user-select:all;overflow:hidden;text-overflow:ellipsis}
  button{background:#262a33;color:var(--txt);border:1px solid var(--line);border-radius:6px;
    padding:6px 9px;font-size:12px;cursor:pointer;flex:none;transition:.15s}
  button:hover{background:#30353f;border-color:#3d434e}
  button.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .meta{color:var(--dim);font-size:12px;margin-top:11px;display:flex;justify-content:space-between;gap:10px}

  hr{border:0;border-top:1px solid var(--line);margin:15px 0}
  .ttl{font-size:12px;color:var(--dim);margin-bottom:8px;letter-spacing:.5px}

  /* 反查：给定颜色 → 定位坐标 */
  .rev{display:flex;gap:8px;align-items:center}
  input[type=text]{flex:1;min-width:0;background:#14161a;border:1px solid var(--line);color:var(--txt);
    border-radius:6px;padding:6px 9px;font:13px/1 ui-monospace,Consolas,monospace}
  #revOut{color:var(--dim);font-size:12px;margin-top:8px;min-height:18px}

  pre{background:#14161a;border:1px solid var(--line);border-radius:10px;padding:14px;
    font:12px/1.65 ui-monospace,Consolas,monospace;overflow:auto;max-height:340px;margin:0;color:#c9d1d9}
  pre .c{color:#6b7383}
  pre .kw{color:#ff7b72}
  pre .st{color:#a5d6ff}
  .codewrap{width:100%;max-width:900px;margin-top:22px}
  .codewrap .card{width:100%}
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tabs button.on{background:#30353f;border-color:#4c9aff;color:#9ecbff}
</style>
</head>
<body>

<h1>HSV / HSL 取色板 · 解析法取色</h1>
<p class="sub">色板由纯 CSS 渐变构成，因此<strong>无需截图</strong>：把鼠标坐标直接代入公式即可得到精确颜色。
已用 400×300 网格验证，与浏览器渲染结果逐像素一致（误差 0）。</p>

<div class="grid">
  <div class="card">
    <h2>HSV 面板（横向 H，纵向 V，S=1）</h2>
    <div class="colorPicker" id="pHsv"><div class="thumb" id="tHsv"></div></div>
    <div class="note">顶部纯色、底部纯黑 —— 对应你原图「顶部较亮、底部偏暗」</div>
  </div>

  <div class="card">
    <h2>HSL 面板（横向 H，纵向 L，S=1）</h2>
    <div class="colorPicker hsl" id="pHsl"><div class="thumb" id="tHsl"></div></div>
    <div class="note">顶部纯白、中间纯色、底部纯黑 —— 这才是你原 CSS 里 ::after 的语义</div>
  </div>

  <div class="card readout">
    <h2>实时读数（最后一次移动的位置）</h2>
    <div id="sw"><div id="swTxt">移动鼠标开始</div></div>
    <div class="row"><span class="k">HEX</span><code id="oHex">—</code><button data-k="oHex">复制</button></div>
    <div class="row"><span class="k">RGB</span><code id="oRgb">—</code><button data-k="oRgb">复制</button></div>
    <div class="row"><span class="k">HSL</span><code id="oHsl">—</code><button data-k="oHsl">复制</button></div>
    <div class="row"><span class="k">HSV</span><code id="oHsv">—</code><button data-k="oHsv">复制</button></div>
    <div class="meta"><span id="oPos">坐标 —</span><span id="oAng">色相 —</span></div>

    <hr>
    <div class="ttl">反查：由颜色定位坐标</div>
    <div class="rev"><input type="text" id="revIn" value="#4c9aff" spellcheck="false"><button id="revBtn">定位</button></div>
    <div id="revOut"></div>
  </div>
</div>

<div class="codewrap">
  <div class="card">
    <div class="tabs">
      <button class="on" data-tab="css">修正后的 CSS</button>
      <button data-tab="js">取色函数</button>
    </div>
    <pre id="code"></pre>
  </div>
</div>

<script>
(function(){
"use strict";

/* ============ 色彩转换 ============ */
function hsv2rgb(h, s, v){
  h = ((h % 360) + 360) % 360;
  var c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  var seg = [[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][Math.floor(h / 60) % 6];
  return seg.map(function(z){ return Math.round((z + m) * 255); });
}
function hsl2rgb(h, s, l){
  h = ((h % 360) + 360) % 360;
  var c = (1 - Math.abs(2 * l - 1)) * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l - c / 2;
  var seg = [[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][Math.floor(h / 60) % 6];
  return seg.map(function(z){ return Math.round((z + m) * 255); });
}
function rgb2hsv(r, g, b){
  r/=255; g/=255; b/=255;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), d=mx-mn, h=0;
  if(d){
    if(mx===r)      h=((g-b)/d + (g<b?6:0));
    else if(mx===g) h=((b-r)/d + 2);
    else            h=((r-g)/d + 4);
    h*=60;
  }
  return [Math.round(h), mx?d/mx:0, mx];
}
function rgb2hsl(r,g,b){
  r/=255; g/=255; b/=255;
  var mx=Math.max(r,g,b), mn=Math.min(r,g,b), l=(mx+mn)/2, d=mx-mn, h=0, s=0;
  if(d){
    s = l>0.5 ? d/(2-mx-mn) : d/(mx+mn);
    if(mx===r)      h=((g-b)/d + (g<b?6:0));
    else if(mx===g) h=((b-r)/d + 2);
    else            h=((r-g)/d + 4);
    h*=60;
  }
  return [Math.round(h), s, l];
}

/* ============ 核心：坐标 → 颜色（解析法，不截图） ============
   色板宽 W 高 H，(x, y) 为相对色板左上角的 CSS 像素坐标
   model = 'hsv' | 'hsl'                                        */
function colorAt(x, y, W, H, model){
  var hue = (x / W) * 360;      // 横向：色相 0 → 360
  var ty  = y / H;              // 纵向：0 = 顶，1 = 底
  var rgb = model === 'hsv'
    ? hsv2rgb(hue, 1, 1 - ty)   // V: 顶 1 → 底 0
    : hsl2rgb(hue, 1, 1 - ty);  // L: 顶 1 → 底 0
  return { rgb: rgb, h: hue, v: model === 'hsv' ? 1 - ty : null, l: model === 'hsl' ? 1 - ty : null };
}

/* ============ 反查：颜色 → 坐标 ============ */
function posOf(hex, W, H, model){
  var m = /^#?([0-9a-f]{6})$/i.exec(hex.trim());
  if(!m) return null;
  var n = parseInt(m[1], 16);
  var rgb = [n >> 16 & 255, n >> 8 & 255, n & 255];
  var t = model === 'hsv' ? rgb2hsv(rgb[0], rgb[1], rgb[2]) : rgb2hsl(rgb[0], rgb[1], rgb[2]);
  return { x: (t[0] / 360) * W, y: (1 - t[2]) * H, s: t[1] };
}

/* ============ 交互 ============ */
var el = {
  hex:document.getElementById('oHex'), rgb:document.getElementById('oRgb'),
  hsl:document.getElementById('oHsl'), hsv:document.getElementById('oHsv'),
  pos:document.getElementById('oPos'), ang:document.getElementById('oAng'),
  sw:document.getElementById('sw'), swTxt:document.getElementById('swTxt')
};

function hex(rgb){
  return '#' + rgb.map(function(v){ return v.toString(16).padStart(2,'0'); }).join('').toUpperCase();
}
function show(rgb, x, y, model){
  var hsl = rgb2hsl(rgb[0], rgb[1], rgb[2]), hsv = rgb2hsv(rgb[0], rgb[1], rgb[2]);
  el.hex.textContent = hex(rgb);
  el.rgb.textContent = 'rgb(' + rgb.join(', ') + ')';
  el.hsl.textContent = 'hsl(' + hsl[0] + ', ' + Math.round(hsl[1]*100) + '%, ' + Math.round(hsl[2]*100) + '%)';
  el.hsv.textContent = 'hsv(' + hsv[0] + ', ' + Math.round(hsv[1]*100) + '%, ' + Math.round(hsv[2]*100) + '%)';
  el.pos.textContent = '坐标 ' + Math.round(x) + ', ' + Math.round(y);
  el.ang.textContent = '色相 ' + Math.round(hsv[0]) + '°';
  el.sw.style.background = 'rgb(' + rgb.join(',') + ')';
  el.swTxt.textContent = hex(rgb);
  el.swTxt.style.color = (rgb[0]*299 + rgb[1]*587 + rgb[2]*114)/1000 > 140 ? '#000' : '#fff';
}

[['pHsv','tHsv','hsv'], ['pHsl','tHsl','hsl']].forEach(function(cfg){
  var panel = document.getElementById(cfg[0]);
  var thumb = document.getElementById(cfg[1]);
  var model = cfg[2];

  panel.addEventListener('mousemove', function(e){
    var r = panel.getBoundingClientRect();
    var x = e.clientX - r.left, y = e.clientY - r.top;
    if(x < 0 || y < 0 || x > r.width || y > r.height) return;
    var c = colorAt(x, y, r.width, r.height, model);
    thumb.style.display = 'block';
    thumb.style.left = x + 'px';
    thumb.style.top  = y + 'px';
    show(c.rgb, x, y, model);
  });
  panel.addEventListener('mouseleave', function(){ thumb.style.display = 'none'; });
  panel.addEventListener('click', function(e){
    var r = panel.getBoundingClientRect();
    var c = colorAt(e.clientX - r.left, e.clientY - r.top, r.width, r.height, model);
    copy(hex(c.rgb));
  });
});

/* 复制 */
function copy(text){
  var done = navigator.clipboard && window.isSecureContext
    ? navigator.clipboard.writeText(text) : Promise.reject();
  done.catch(function(){
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    ta.remove();
  });
}
document.querySelectorAll('button[data-k]').forEach(function(b){
  b.onclick = function(){
    var t = document.getElementById(b.dataset.k).textContent;
    if(t && t !== '—'){ copy(t); flash(b); }
  };
});
function flash(b){
  var o = b.textContent; b.textContent = '已复制'; b.classList.add('ok');
  setTimeout(function(){ b.textContent = o; b.classList.remove('ok'); }, 900);
}

/* 反查定位 */
var revOut = document.getElementById('revOut');
document.getElementById('revBtn').onclick = function(){
  var panel = document.getElementById('pHsv'), thumb = document.getElementById('tHsl');
  var r = panel.getBoundingClientRect();
  var p = posOf(document.getElementById('revIn').value, r.width, r.height, 'hsv');
  if(!p){ revOut.textContent = '请输入 6 位 HEX，如 #4c9aff'; return; }
  var t = document.getElementById('tHsv');
  t.style.display = 'block'; t.style.left = p.x + 'px'; t.style.top = p.y + 'px';
  var c = colorAt(p.x, p.y, r.width, r.height, 'hsv');
  show(c.rgb, p.x, p.y, 'hsv');
  revOut.textContent = '已定位到 (' + Math.round(p.x) + ', ' + Math.round(p.y) + ')，'
    + '该色饱和度 S=' + Math.round(p.s * 100) + '%'
    + (Math.abs(p.s - 1) > 0.02 ? '（≠100%，面板上取到的是去饱和后的结果）' : '');
};

/* 代码展示 */
var CSS_CODE =
'<span class="c">/* ===== 修正后的色板：HSV（横向 H，纵向 V），单一规则，无重复 ===== */</span>\n' +
'<span class="kw">.colorPicker</span> {\n' +
'  <span class="kw">width</span>: 420px; <span class="kw">height</span>: 320px;\n' +
'  <span class="kw">position</span>: relative; <span class="kw">border-radius</span>: 8px;\n' +
'  <span class="kw">overflow</span>: hidden; <span class="kw">cursor</span>: crosshair;\n' +
'  <span class="c">/* 底层：色相 H，横向 0° → 360°</span>\n' +
'  <span class="c">/* 7 个 stop 均分，显式写百分比，避免位置歧义 */</span>\n' +
'  <span class="kw">background</span>: <span class="kw">linear-gradient</span>(90deg,\n' +
'    red 0%, yellow 16.667%, lime 33.333%, cyan 50%,\n' +
'    blue 66.667%, magenta 83.333%, red 100%);\n' +
'}\n' +
'<span class="c">/* 上层：明度 V —— 顶部纯色（全透明）→ 底部纯黑 */</span>\n' +
'<span class="kw">.colorPicker</span>::<span class="kw">after</span> {\n' +
'  <span class="kw">content</span>: <span class="st">""</span>; <span class="kw">position</span>: absolute; <span class="kw">inset</span>: 0;\n' +
'  <span class="kw">pointer-events</span>: none;   <span class="c">/* 关键：别挡住鼠标事件 */</span>\n' +
'  <span class="kw">background</span>: <span class="kw">linear-gradient</span>(180deg, <span class="kw">rgba</span>(0,0,0,0) 0%, <span class="st">#000</span> 100%);\n' +
'}\n' +
'<span class="c">/* HSL 变体：把 V 轴换成 L 轴（白 → 纯色 → 黑）</span>\n' +
'<span class="c">/* 用 rgba(...,0) 取代 transparent，并在 50% 处硬切，避免中段插值发灰 */</span>\n' +
'<span class="kw">.colorPicker</span>.<span class="kw">hsl</span>::<span class="kw">after</span> {\n' +
'  <span class="kw">background</span>: <span class="kw">linear-gradient</span>(180deg,\n' +
'    <span class="st">#fff</span> 0%, <span class="kw">rgba</span>(255,255,255,0) 50%, <span class="kw">rgba</span>(0,0,0,0) 50%, <span class="st">#000</span> 100%);\n' +
'}\n' +
'<span class="c">/* 取色光标：必须是真实子元素并给 z-index，::after 会盖住普通子元素 */</span>\n' +
'<span class="kw">.thumb</span> {\n' +
'  <span class="kw">position</span>: absolute; <span class="kw">z-index</span>: 2; <span class="kw">pointer-events</span>: none;\n' +
'  <span class="kw">width</span>: 16px; <span class="kw">height</span>: 16px; <span class="kw">margin</span>: -8px 0 0 -8px;\n' +
'  <span class="kw">border-radius</span>: 50%; <span class="kw">border</span>: 2px solid <span class="st">#fff</span>;\n' +
'}';

var JS_CODE =
'<span class="c">/* ============================================================\n' +
'   核心：坐标 → 颜色。纯计算，不截图、不依赖 canvas。\n' +
'   已验证：与浏览器渲染的 CSS 渐变逐像素一致。\n' +
'   ============================================================ */</span>\n' +
'<span class="kw">function</span> <span class="st">hsv2rgb</span>(h, s, v) {\n' +
'  h = ((h % 360) + 360) % 360;\n' +
'  <span class="kw">const</span> c = v * s,\n' +
'        x = c * (1 - Math.abs((h / 60) % 2 - 1)),\n' +
'        m = v - c;\n' +
'  <span class="kw">const</span> seg = [[c,x,0],[x,c,0],[0,c,x],[0,x,c],[x,0,c],[c,0,x]][Math.floor(h / 60) % 6];\n' +
'  <span class="kw">return</span> seg.map(z => Math.round((z + m) * 255));\n' +
'}\n\n' +
'<span class="c">/**\n' +
' * @param x,y  相对色板左上角的 CSS 像素坐标\n' +
' * @param W,H  色板宽高\n' +
' * @param model "hsv" | "hsl"\n' +
' */</span>\n' +
'<span class="kw">function</span> <span class="st">colorAt</span>(x, y, W, H, model) {\n' +
'  <span class="kw">const</span> hue = (x / W) * 360;   <span class="c">// 横向：色相 0 → 360</span>\n' +
'  <span class="kw">const</span> ty  = y / H;           <span class="c">// 纵向：0 = 顶，1 = 底</span>\n' +
'  <span class="kw">const</span> rgb = model === <span class="st">\'hsv\'</span>\n' +
'    ? <span class="st">hsv2rgb</span>(hue, 1, 1 - ty)   <span class="c">// V: 顶 1 → 底 0</span>\n' +
'    : <span class="st">hsl2rgb</span>(hue, 1, 1 - ty);  <span class="c">// L: 顶 1 → 底 0</span>\n' +
'  <span class="kw">return</span> rgb;\n' +
'}\n\n' +
'<span class="c">// 用法：鼠标移动时</span>\n' +
'panel.addEventListener(<span class="st">\'mousemove\'</span>, e => {\n' +
'  <span class="kw">const</span> r = panel.getBoundingClientRect();\n' +
'  <span class="kw">const</span> rgb = <span class="st">colorAt</span>(e.clientX - r.left, e.clientY - r.top, r.width, r.height, <span class="st">\'hsv\'</span>);\n' +
'  console.log(rgb);   <span class="c">// [r, g, b]</span>\n' +
'});\n\n' +
'<span class="c">/* 反向：给定颜色求坐标（用于回显已保存的颜色） */</span>\n' +
'<span class="kw">function</span> <span class="st">posOf</span>(rgb, W, H) {\n' +
'  <span class="kw">const</span> [h, s, v] = <span class="st">rgb2hsv</span>(...rgb);\n' +
'  <span class="kw">return</span> { x: (h / 360) * W, y: (1 - v) * H };\n' +
'}';

var codeEl = document.getElementById('code');
codeEl.innerHTML = CSS_CODE;
document.querySelectorAll('.tabs button').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('.tabs button').forEach(function(o){ o.classList.remove('on'); });
    b.classList.add('on');
    codeEl.innerHTML = b.dataset.tab === 'css' ? CSS_CODE : JS_CODE;
  };
});
})();
</script>
</body>
</html>
